<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday MADAM JI 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow: hidden;
  color: white;
}

h1 {
  margin-top: 60px;
  font-size: 3rem;
  animation: fadeIn 2s ease-in-out;
}

button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #ff4e50;
  cursor: pointer;
  margin-top: 20px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

#message {
  display: none;
  font-size: 1.5rem;
  margin-top: 20px;
  animation: fadeIn 2s ease-in-out;
}

/* Cake */
.cake {
  position: relative;
  margin: 40px auto;
  width: 200px;
  height: 200px;
}

.layer {
  width: 200px;
  height: 60px;
  background: #ffcc70;
  border-radius: 10px;
  margin-top: 5px;
}

.icing {
  width: 200px;
  height: 30px;
  background: #fff;
  border-radius: 10px 10px 0 0;
}

.candle {
  width: 10px;
  height: 40px;
  background: red;
  margin: 0 auto;
  position: relative;
}

.flame {
  width: 15px;
  height: 15px;
  background: yellow;
  border-radius: 50%;
  position: absolute;
  top: -15px;
  left: -2px;
  animation: flicker 0.3s infinite alternate;
}

@keyframes flicker {
  from { transform: scale(1); opacity: 1;}
  to { transform: scale(1.2); opacity: 0.7;}
}

/* Cut animation */
.cut {
  animation: cutCake 2s forwards;
}

@keyframes cutCake {
  0% { transform: rotate(0); }
  100% { transform: rotate(10deg) translateX(20px); }
}

/* Balloons */
.balloon {
  position: absolute;
  bottom: -100px;
  width: 40px;
  height: 60px;
  border-radius: 50%;
  animation: float 10s infinite ease-in;
}

.balloon:nth-child(1){ left:10%; background:#ff4e50;}
.balloon:nth-child(2){ left:30%; background:#f9d423;}
.balloon:nth-child(3){ left:50%; background:#24c6dc;}
.balloon:nth-child(4){ left:70%; background:#e056fd;}
.balloon:nth-child(5){ left:90%; background:#1dd1a1;}

@keyframes float {
  from {transform: translateY(0);}
  to {transform: translateY(-110vh);}
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday MADAM JI 🎂</h1>

<div class="cake" id="cake">
  <div class="candle">
    <div class="flame" id="flame"></div>
  </div>
  <div class="icing"></div>
  <div class="layer"></div>
  <div class="layer"></div>
</div>

<button onclick="cutCake()">Cut the Cake 🎂</button>

<div id="message">
  💖 Wishing you endless happiness, success & love MADAM JI 💖<br>
  May all your dreams come true ✨🎁
</div>

<!-- Music -->
<audio id="music" loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
</audio>

<!-- Balloons -->
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>

<script>
function cutCake() {
  document.getElementById("cake").classList.add("cut");
  document.getElementById("flame").style.display = "none";
  document.getElementById("message").style.display = "block";
  document.getElementById("music").play();
}
</script>

</body>
</html>
